name: extension-release

# Tag-driven release for the browser extension: tag `ext-vX.Y.Z` (after
# bumping the versions in extension/package.json and both manifests) and
# this workflow builds, tests, packages, and attaches both store-ready
# zips to a GitHub release.
on:
  push:
    tags:
      - "ext-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun test
      - name: Verify the tag matches the manifest version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#ext-v}"
          for f in package.json src/manifest.chrome.json src/manifest.firefox.json; do
            v=$(python3 -c "import json;print(json.load(open('$f'))['version'])")
            if [ "$v" != "$tag" ]; then
              echo "Version mismatch: $f has $v but tag is $tag" >&2
              exit 1
            fi
          done
      - name: Build and package
        run: bun run package
      - name: Lint Firefox package
        run: bun run lint:firefox
      - name: Create GitHub release with the zips
        uses: softprops/action-gh-release@v2
        with:
          name: Extension ${{ github.ref_name }}
          files: extension/dist/lnemail-extension-*.zip
          body: |
            Builds of the LNemail browser extension.

            ## Firefox

            Install the signed release from [Firefox Add-ons](https://addons.mozilla.org/en-US/firefox/addon/lnemail/). The attached Firefox zip is the unsigned build for review and development.

            ## Chrome / Chromium desktop

            1. Download `lnemail-extension-chrome-*.zip` below.
            2. Extract it into a permanent folder. Do not load the zip itself.
            3. Open `chrome://extensions` (or your browser's equivalent page) and enable Developer mode.
            4. Click **Load unpacked** and select the extracted folder containing `manifest.json`.

            Updates are manual: replace the contents of that same folder with a newer release and click **Reload** on the extensions page. Keeping the same folder path preserves the unpacked extension identity and locally stored accounts.

            See `extension/README.md` for complete installation and build instructions.
