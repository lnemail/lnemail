name: extension-release

# Tag-driven release for the browser extension: tag `ext-vX.Y.Z` (after
# bumping the versions in extension/package.json and both manifests) and
# this workflow builds, tests, packages, and attaches both store-ready
# zips to a GitHub release. See extension/PUBLISHING.md.
on:
  push:
    tags:
      - "ext-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun test
      - name: Verify the tag matches the manifest version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#ext-v}"
          for f in package.json src/manifest.chrome.json src/manifest.firefox.json; do
            v=$(python3 -c "import json;print(json.load(open('$f'))['version'])")
            if [ "$v" != "$tag" ]; then
              echo "Version mismatch: $f has $v but tag is $tag" >&2
              exit 1
            fi
          done
      - name: Build and package
        run: bun run package
      - name: Create GitHub release with the zips
        uses: softprops/action-gh-release@v2
        with:
          name: Extension ${{ github.ref_name }}
          files: extension/dist/lnemail-extension-*.zip
          body: |
            Store-ready builds of the LNemail browser extension.

            - `lnemail-extension-chrome-*.zip`: Chrome / Chromium
            - `lnemail-extension-firefox-*.zip`: Firefox

            See `extension/README.md` for installation and
            `extension/PUBLISHING.md` for store submission steps.
